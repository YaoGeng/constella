# constella-server 镜像构建（部署标准 §6.5 步 1「CI 完成镜像构建并推送」——部署执行链 2026-11-12 启用；
# mantis/zfk 同款 GHCR 路径）。触发＝tag `server-v<版本>`；镜像=ghcr.io/yaogeng/constella-server:<版本>。
# 构建上下文=仓库根（server/Dockerfile pnpm workspace 形——T6-14 DEPLOY.md「镜像形态」节）；禁 latest（§6.1）。
name: build-server-image

on:
  push:
    tags: ['server-v*']

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 从 tag 提取版本（server-v1.0.0 → 1.0.0；与 .env CONSTELLA_VERSION 三者一致——DEPLOY.md 步 3）
        id: ver
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ghcr.io/yaogeng/constella-server:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
