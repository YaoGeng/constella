# constella.aim8848.com —— S-01 生产反代配置（T6-14；部署标准 §5.3 模板逐条照抄、仅改标识）。
# 标识三处（相对模板 ljr 例）：① server_name constella.aim8848.com；
#   ② 证书：通配符 *.aim8848.com 全子域共用一张（§5.2），挂载路径与模板一致 /etc/nginx/certs/；
#   ③ 日志名 constella.aim8848.com.*.log（§5.6 按域名记录，宿主 /opt/aim/infra/nginx/logs/ 供 fail2ban 读取）。
# 安装位：/opt/aim/infra/nginx/conf.d/constella.conf（conf.d 只读挂载进 aim-nginx）；
#   校验与重载按 §5.5：docker exec aim-nginx nginx -t → nginx -s reload（SOP 见 server/deploy/DEPLOY.md 步 4）。
# 寻址（§5.3 容器化注记）：aim-nginx 运行于容器内，127.0.0.1 指向 nginx 自身会 502——
#   走 infra 共享网络按容器名寻址 + resolver 把解析推迟到请求期（后端容器不在时 reload 仍成功，不拖垮其他产品）。

# resolver 可处 http 级（conf.d include 上下文）；set 变量须在 server 块内（§5.3 注记「server 级」）
resolver 127.0.0.11 valid=30s ipv6=off;    # Docker 内置 DNS（§5.3 注记）

server {
    listen 443 ssl;
    server_name constella.aim8848.com;

    # 容器名=compose container_name（compose.yml 钉死 constella-server）——与 §5.3 注记 ljr-backend 同款；
    # 变量化寻址使解析推迟到请求期：后端容器未起时 reload 仍成功，不拖垮其他产品
    set $upstream_constella constella-server:8051;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    server_tokens off;
    # 模板 10m 按产品上调：market 包 zip ≤20MB（manifest-guard MAX_ARCHIVE_BYTES）+ multipart 开销 → 25m
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # §5.6：按域名记录（挂载至宿主 logs/ 目录；logrotate 每周轮转保留 8 份）
    access_log /var/log/nginx/constella.aim8848.com.access.log;
    error_log  /var/log/nginx/constella.aim8848.com.error.log;

    # 用户端：V1 无用户端 Web（client=桌面端 Tauri 应用，非浏览器分发）——根路径不开入口，未知路径 404
    location / {
        return 404;
    }

    # 管理后台：归 T6-15（A-01——静态托管 /opt/aim/constella/www/admin/ + auth_basic + limit_req zone=admin
    #   + try_files /admin/index.html SPA 回退）。本卡 T6-14 仅占位注释不写；上线前 /admin 必须启用
    #   Basic Auth（§5.4 后台强制要求——未启用 Basic Auth 的后台不得对外开放）。

    # 后端接口（模板逐条照抄；两处与 ljr 例不同——① proxy_pass 用容器名变量（§5.3 注记）；
    #   ② 不带尾斜杠重写：constella 后端路由自带 /api 前缀（C5），透传完整路径）
    location /api/ {
        proxy_pass http://$upstream_constella;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;             # 支持 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        limit_req zone=api burst=40 nodelay;      # 接口限速防 CC（zone 定义于 00-hardening.conf，§5.7）
    }

    # /healthz 透传（契约#3：UptimeRobot 拨测入口——DEPLOY.md 步 8；server 端返回 200 {"status":"ok"}）
    location = /healthz {
        proxy_pass http://$upstream_constella;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTP 全部跳转 HTTPS（模板照抄；server_name 用具体域名而非模板通配——
# 避免与既有产品 conf 的通配 HTTP 段重复声明同名 server）
server {
    listen 80;
    server_name constella.aim8848.com;
    return 301 https://$host$request_uri;
}
