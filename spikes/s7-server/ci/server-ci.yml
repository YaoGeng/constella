# S-7 产出：constella 仓库 server CI 就绪件（放 .github/workflows/server-ci.yml）
# 实际运行留待 constella 推送 GitHub 后；本次仅通过 actionlint 语法校验。
# 与 spike 验证链路一致：lint/typecheck/build → 镜像构建 → compose 冒烟（注册/登录/刷新）。
name: server-ci

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-ci.yml"]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.6"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        env:
          # Prisma 7 的 prisma.config.ts 顶层求值要求 DATABASE_URL 存在；generate 不连库，占位即可
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  image-smoke:
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v5
      - name: Build server image
        run: docker build -t constella-server:ci ./server
      - name: Compose smoke (pg + server, migrate on boot, auth roundtrip)
        env:
          PG_PASSWORD: ci-smoke-password
          JWT_SECRET: ci-smoke-jwt-secret-0123456789abcdef012345
          JWT_REFRESH_SECRET: ci-smoke-refresh-0123456789abcdef012345
        run: |
          cd server
          docker compose -p constella-ci up -d --wait
          # healthz（契约第 3 条）
          curl -sf http://127.0.0.1:8051/healthz
          # 注册 → 登录 → 刷新（S-7 判据同款断言）
          REG=$(curl -sf -X POST http://127.0.0.1:8051/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@constella.test","password":"Ci-Valid-Passw0rd"}')
          RT=$(printf '%s' "$REG" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.refreshToken)process.exit(1);console.log(j.refreshToken)})")
          LOGIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8051/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@constella.test","password":"Ci-Valid-Passw0rd"}')
          REFRESH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8051/auth/refresh \
            -H "Content-Type: application/json" \
            -d "{\"refreshToken\":\"$RT\"}")
          echo "login=$LOGIN_CODE refresh=$REFRESH_CODE"
          test "$LOGIN_CODE" = "200" -a "$REFRESH_CODE" = "200"
      - name: Teardown
        if: always()
        run: docker compose -p constella-ci down -v
